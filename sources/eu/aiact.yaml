id: aiact
type: eu-legislation
name:
  fi: Tekoälyasetus (AI Act)
  en: Artificial Intelligence Act (AI Act)
reference:
  fi: Asetus (EU) 2024/1689, muutettu asetuksella (EU) 2026/1744
  en: Regulation (EU) 2024/1689, amended by Regulation (EU) 2026/1744
status:
  fi: 'Porrastetusti 2025–2028: kiellot 2.2.2025, art. 50 2.8.2026, liite III 2.12.2027, liite I 2.8.2028'
  en: 'Phased 2025–2028: prohibitions 2 Feb 2025, Art. 50 2 Aug 2026, Annex III 2 Dec 2027, Annex I 2 Aug 2028'
summary:
  fi: Tunteiden tunnistus on kielletty työpaikoilla ja oppilaitoksissa. Riskiluokka kannattaa tunnistaa jo konseptivaiheessa.
  en: Emotion recognition is banned in workplaces and educational institutions. The risk class is worth identifying already at the concept stage.
jurisdiction: EU
primary_sources:
- title: EUR-Lex, asetus (EU) 2024/1689
  url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
- title: EUR-Lex, asetus (EU) 2026/1744 (tekoälyasetuksen muutos)
  url: https://eur-lex.europa.eu/eli/reg/2026/1744/oj
finland:
  authority:
    fi: Traficom (keskitetty yhteyspiste)
    en: Traficom (single point of contact)
  national_guidance: []
related_standards: [c2pa, ieee-1589]
applies_when:
- condition:
    fi: XR-sovelluksessa on tekoälyhahmo, chatbot tai virtuaaliavustaja, jonka kanssa käyttäjä on vuorovaikutuksessa.
    en: The XR application has an AI character, chatbot or virtual assistant that the user interacts with.
  obligation:
    fi: Tarjoajan on suunniteltava järjestelmä niin, että käyttäjälle kerrotaan hänen olevan vuorovaikutuksessa tekoälyn kanssa, ellei se ole ilmeistä valistuneelle ja tarkkaavaiselle käyttäjälle. Tieto annetaan selkeästi ja esteettömästi viimeistään ensimmäisen vuorovaikutuksen yhteydessä.
    en: The provider must design the system so that users are told they are interacting with AI, unless this is obvious to a reasonably well-informed and observant user. The information is given clearly and accessibly at the latest at the first interaction.
  article: art. 50(1), 50(5)
- condition:
    fi: Sovellus tuottaa synteettistä kuvaa, ääntä, videota tai 3D-sisältöä, esim. generoituja avatareja tai deepfake-sisältöä.
    en: The application generates synthetic images, audio, video or 3D content, e.g. generated avatars or deepfakes.
  obligation:
    fi: Tuotettu sisältö merkitään koneluettavasti keinotekoiseksi, ja deepfaket ilmoitetaan. Ennen 2.8.2026 markkinoille saatettujen järjestelmien on noudatettava merkintävelvoitetta 2.12.2026 mennessä.
    en: Generated content is marked as artificial in a machine-readable way and deepfakes are disclosed. Systems placed on the market before 2 Aug 2026 must comply with the marking obligation by 2 Dec 2026.
  article: art. 50(2), 50(4), art. 111(4)
- condition:
    fi: Sovellus tai avatarityökalu tuottaa tai muokkaa todenmukaisia kuvia, videoita, ääntä tai 3D-sisältöä tunnistettavista ihmisistä, esim. henkilön näköiset avatarit, volumetriset kaksoset tai kasvojen vaihto.
    en: The app or avatar tool generates or manipulates realistic images, video, audio or 3D content of identifiable people, e.g. lookalike avatars, volumetric doubles or face swaps.
  obligation:
    fi: 'Kielletty 2.12.2026 alkaen: tekoäly, joka tuottaa tai muokkaa tunnistettavan henkilön intiimialueita tai seksuaalista toimintaa esittävää todenmukaista materiaalia ilman tämän nimenomaista suostumusta, sekä lasten seksuaalista hyväksikäyttöä esittävää aineistoa. Järjestelmän tarjoaminen on kielletty, jos tällainen tuottaminen on sen käyttötarkoitus tai kohtuudella ennakoitava ja toistettava tulos ilman kohtuullisia teknisiä estoja. Käytännössä avatar- ja kasvogeneraattoreihin tarvitaan suojatoimet väärinkäytön estämiseksi ja ilmoitettujen väärinkäytösten korjaamiseksi. Muuten sovelletaan art. 50:n merkintä- ja ilmoitusvelvoitteita.'
    en: 'Prohibited from 2 Dec 2026: AI that generates or manipulates realistic material showing an identifiable person''s intimate parts or sexual activity without their explicit consent, and child sexual abuse material. Offering the system is prohibited if such generation is its intended purpose or a reasonably foreseeable and repeatable outcome without reasonable technical safeguards. In practice avatar and face generators need safeguards to prevent misuse and to fix reported misuse. Otherwise the Art. 50 marking and disclosure obligations apply.'
  article: art. 5(1)(ba), 5(1)(bb), 5(1a), 5(1b), art. 113(a) (muutettu asetuksella 2026/1744)
- condition:
    fi: Sovellus päättelee käyttäjän tunteita tai aikomuksia biometrisistä tiedoista, esim. katseesta, ilmeistä, äänestä tai liikkeistä.
    en: The app infers the user's emotions or intentions from biometric data, e.g. gaze, facial expressions, voice or movement.
  obligation:
    fi: 'Kyse on tunteentunnistusjärjestelmästä. Tunteiden päätteleminen työpaikalla ja oppilaitoksissa on kielletty 2.2.2025 alkaen, paitsi lääketieteellisiin tai turvallisuuteen liittyviin tarkoituksiin (esim. VR-terapia tai kuljettajan väsymyksen tunnistus). Kielto koskee sekä markkinoille saattamista että käyttöä, joten myös työpaikan VR-koulutus tai koulun XR-oppimisympäristö kuuluu siihen. Muissa yhteyksissä käyttöönottajan on ilmoitettava järjestelmästä sille altistuville selkeästi viimeistään ensimmäisen vuorovaikutuksen yhteydessä ja käsiteltävä henkilötiedot GDPR:n mukaisesti (ks. gdpr). Määritelmä edellyttää biometrisiä tietoja, joten pelkkään tekstiin perustuva tunteiden päättely ei ole tunteentunnistusjärjestelmä.'
    en: 'This is an emotion recognition system. Inferring emotions in the workplace and in educational institutions is prohibited from 2 Feb 2025, except for medical or safety reasons (e.g. VR therapy or driver fatigue detection). The ban covers both placing on the market and use, so workplace VR training or a school XR learning environment is also covered. Elsewhere the deployer must inform people exposed to the system clearly at the latest at the first interaction, and process personal data under the GDPR (see gdpr). The definition requires biometric data, so emotion inference from text alone is not an emotion recognition system.'
  article: art. 3(39), art. 5(1)(f), art. 50(3), 50(5), art. 113(a)
- condition:
    fi: Tekoälyä käytetään koulutuksessa tai työelämässä arviointiin tai päätöksiin, esim. VR-koulutuksen suoritusarviointi tai rekrytointi.
    en: AI is used for assessment or decisions in education or employment, e.g. scoring VR training or recruitment.
  obligation:
    fi: 'Liitteen III järjestelmät ovat suuririskisiä: riskienhallinta, tekninen dokumentaatio ja ihmisvalvonta. Poikkeus: järjestelmä ei ole suuririskinen, jos se ei aiheuta merkittävää vahingon riskiä eikä vaikuta olennaisesti päätöksen tulokseen, esim. se tekee vain suppean menettelyllisen tehtävän, parantaa ihmisen jo tekemän työn tulosta, havaitsee poikkeamia korvaamatta ihmisen arviota tai tekee valmistelevan tehtävän. Profilointia tekevä järjestelmä on aina suuririskinen. Jos tarjoaja vetoaa poikkeukseen, se dokumentoi arvion ennen markkinoille saattamista ja rekisteröi järjestelmän EU:n tietokantaan. Sovelletaan 2.12.2027 alkaen (muutosasetus 2026/1744); alkuperäisessä tekstissä päivä oli 2.8.2026. Ennen tätä päivää markkinoille saatettuun järjestelmätyyppiin sovelletaan asetusta vain, jos sen rakenne muuttuu merkittävästi.'
    en: 'Annex III systems are high-risk: risk management, technical documentation and human oversight. Exception: a system is not high-risk if it poses no significant risk of harm and does not materially influence the outcome of decision-making, e.g. it only performs a narrow procedural task, improves the result of a previously completed human activity, detects deviations without replacing human assessment, or performs a preparatory task. A system that profiles natural persons is always high-risk. A provider relying on the exception documents its assessment before placing on the market and registers the system in the EU database. Applies from 2 Dec 2027 (amending Regulation 2026/1744); the original text had 2 Aug 2026. A system type placed on the market before that date is covered only if its design changes significantly.'
  article: art. 6(2), 6(3), 6(4), liite III kohdat 3 ja 4, art. 111(2), art. 113(c)(i)
- condition:
    fi: Tekoäly on osa tuotetta, jota koskee liitteen I tuotelainsäädäntö, esim. lääkinnällinen XR-laite tai lelu.
    en: AI is part of a product covered by Annex I product legislation, e.g. a medical XR device or a toy.
  obligation:
    fi: Järjestelmä on suuririskinen, jos se on tuotteen turvakomponentti tai itse tuote ja tuotteelle tehdään kolmannen osapuolen vaatimustenmukaisuuden arviointi (esim. MDR:n luokan IIa tai korkeampi laite). Turvakomponentiksi ei katsota tekoälyä, jota käytetään vain käyttäjätukeen, suorituskyvyn optimointiin, automaatioon, käyttömukavuuteen tai muuhun kuin turvallisuuteen liittyvään laadunvalvontaan, ellei sen vika vaarantaisi terveyttä tai turvallisuutta. Vaatimuksia sovelletaan 2.8.2028 alkaen (muutosasetus 2026/1744); alkuperäisessä tekstissä päivä oli 2.8.2027.
    en: The system is high-risk if it is a safety component of a product or the product itself and the product undergoes third-party conformity assessment (e.g. an MDR class IIa or higher device). AI used only for user support, performance optimisation, automation, comfort or non-safety quality control is not a safety component, unless its failure would endanger health or safety. Requirements apply from 2 Aug 2028 (amending Regulation 2026/1744); the original text had 2 Aug 2027.
  article: art. 6(1), 6(1a), 6(1b), liite I, art. 113(c)(ii)
- condition:
    fi: Organisaatio tarjoaa tai ottaa käyttöön minkä tahansa tekoälyjärjestelmän, esim. XR-sovelluksen tekoälyhahmon tai generatiivisen työkalun.
    en: An organisation provides or deploys any AI system, e.g. an AI character in an XR app or a generative tool.
  obligation:
    fi: 'Tekoälylukutaito: toteuta toimia, joilla tuet henkilöstön ja muiden puolestasi tekoälyä käyttävien tekoälylukutaitoa, ottaen huomioon heidän osaamisensa ja käyttöyhteyden. Muutosasetuksen jälkeen velvoite ei edellytä tietyn osaamistason takaamista kenellekään yksittäiselle henkilölle. Komissio julkaisee käytännön esimerkkejä.'
    en: 'AI literacy: take measures to support the AI literacy of staff and others operating AI on your behalf, taking into account their knowledge and the context of use. After the amendment the obligation does not require guaranteeing a given level of literacy for any individual. The Commission publishes practical examples.'
  article: art. 4 (muutettu asetuksella 2026/1744)
