last_verified: '2026-11-24'
todo: 'Art. 3(39), 5, 6, 50 ja 113 tarkistettu alkuperäisen asetuksen suomenkielisestä tekstistä (Anna, 24.11.2026). Alkuperäisen 113 artiklan mukaan yleinen soveltaminen 2.8.2026 ja art. 6(1) 2.8.2027. Muutosasetus 2026/1744 (annettu 8.7.2026, EUVL 24.7.2026) tarkistettu: art. 4, 5, 6, 111 ja 113 (Anna, 24.11.2026); art. 50(1)–(4) ennallaan. Tarkistamatta liitteen III kohdat 3 ja 4, liite I, art. 4 a (erityiset henkilötietoryhmät vinoutumien korjaamiseen) ja 6(3)-järjestelmien yksinkertaistettu rekisteröinti (art. 49(2)). Lisää Traficomin tekoälyasetusta koskevat ohjesivut (finland.national_guidance).'
