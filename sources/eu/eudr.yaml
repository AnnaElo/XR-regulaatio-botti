- title: Euroopan unionin neuvosto, Forest protection
  url: https://www.consilium.europa.eu/en/policies/forest-protection/
finland:
  authority:
    fi: Tarkistamaton
    en: Unverified
  national_guidance: []
related_documents: [nature-digital-twin, forest-monitoring]
applies_when:
- condition:
    fi: Digikaksosta tai sen dataa käytetään puun EU:n markkinoille saattamisen tai viennin dokumentointiin, esim. hakkuualueen paikkatietoon.
    en: The digital twin or its data is used to document placing timber on the EU market or exporting it, e.g. geolocation of the harvest area.
  obligation:
    fi: Velvoite koskee puuta markkinoille saattavaa toimijaa, ei digikaksosta itseään. Digikaksonen voi tukea toimijan selvitysvelvollisuutta. Pelkkä metsän visualisointi tai opetuskäyttö ei kuulu asetuksen piiriin.
    en: The obligation falls on the operator placing timber on the market, not on the digital twin itself. The twin may support the operator's due diligence. Mere visualisation or educational use is out of scope.
  article: ''
keywords: [metsäkato, EUDR, puukauppa, hakkuu, deforestation, timber]
last_verified: '2026-11-24'
todo: Muutosasetuksen julkaisua EU:n virallisessa lehdessä ei vahvistettu. Suomen valvova viranomainen tarkistamatta.
