id: eudr
type: eu-legislation
name:
  fi: Metsäkatoasetus (EUDR)
  en: EU Deforestation Regulation (EUDR)
reference:
  fi: Asetus (EU) 2023/1115, muutettu 2025
  en: Regulation (EU) 2023/1115, amended 2025
status:
  fi: Suuret toimijat ja kauppiaat 30.12.2026 alkaen, pienet toimijat 30.6.2027 alkaen
  en: Large operators and traders from 30 Dec 2026, small operators from 30 Jun 2027
summary:
  fi: Säätelee metsäkatoa aiheuttavien tuotteiden, kuten puun, tuontia EU:hun ja vientiä EU:sta; tuotteiden ja toimitusketjujen on oltava metsäkadottomia. Vain ensimmäinen tuotteen markkinoille saattava yritys antaa due diligence -lausunnon; mikro- ja pienet alkutuottajat antavat kertaluonteisen yksinkertaistetun ilmoituksen.
  en: Regulates the entry into and export from the EU of products linked to deforestation, such as wood; products and supply chains must be deforestation-free. Only the first business placing a product on the market submits a due diligence statement; micro and small primary operators submit a one-off simplified declaration.
jurisdiction: EU
use_cases: [industry]
content_sources: []
primary_sources:
