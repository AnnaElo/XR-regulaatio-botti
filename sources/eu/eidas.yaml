id: eidas
type: eu-legislation
name:
  fi: eIDAS 2.0
  en: eIDAS 2.0
reference:
  fi: Asetus (EU) 2024/1183
  en: Regulation (EU) 2024/1183
status:
  fi: Voimaan 20.5.2024
  en: In force since 20 May 2024
summary:
  fi: Eurooppalainen digitaalisen identiteetin lompakko, jonka käyttö on käyttäjälle vapaaehtoista. Lompakkoon luottavien palvelujen (luottavat osapuolet) on rekisteröidyttävä ja pyydettävä vain ilmoittamiaan tietoja. Julkisten verkkopalvelujen ja tiettyjen yksityisten palvelujen on hyväksyttävä lompakko.
  en: A European digital identity wallet whose use is voluntary for users. Services relying on the wallet (relying parties) must register and request only the data they declared. Public online services and certain private services must accept the wallet.
jurisdiction: EU
primary_sources:
- title: EUR-Lex, asetus (EU) 2024/1183
  url: https://eur-lex.europa.eu/eli/reg/2024/1183/oj
finland:
  authority:
    fi: Digi- ja väestötietovirasto tarjoaa lompakon (HE 17/2026 vp)
    en: The Digital and Population Data Services Agency provides the wallet (government proposal HE 17/2026)
  national_guidance: []
related_standards: [oidc, vc, did]
related_documents: [dsa, eaa, vr-login-eyetracking]
applies_when:
- condition:
    fi: Palvelu aikoo ottaa vastaan tietoja EU:n digitaalisen identiteetin lompakosta (esim. ikä, henkilöllisyys, pätevyys) eli toimia luottavana osapuolena.
    en: The service intends to accept data from the EU Digital Identity Wallet (e.g. age, identity, qualifications), i.e. act as a relying party.
  obligation:
    fi: 'Rekisteröidy sijoittautumisvaltiossa: anna nimi, rekisterinumero, yhteystiedot ja lompakon käyttötarkoitus sekä pyydettävät tiedot. Älä pyydä muita kuin ilmoittamiasi tietoja. Tunnistaudu käyttäjälle, todenna ja validoi saamasi tiedot, äläkä kiellä pseudonyymien käyttöä, ellei laki edellytä tunnistamista. Ilmoita muutoksista rekisteröintitietoihin viipymättä. Puolestasi toimiva välittäjä on itsekin luottava osapuoli, eikä se saa tallentaa transaktion sisältöä. Tekninen toteutus: ks. oidc (OpenID4VP) ja vc.'
    en: 'Register in your Member State of establishment: give your name, registration number, contact details, the intended use of the wallet and the data you will request. Do not request data beyond what you declared. Identify yourself to the user, verify and validate the data received, and do not prohibit pseudonyms unless law requires identification. Report changes to registration data without delay. An intermediary acting for you is itself a relying party and may not store transaction content. Technical implementation: see oidc (OpenID4VP) and vc.'
  article: art. 5 b
- condition:
    fi: Julkisen sektorin verkkopalvelu edellyttää sähköistä tunnistamista (esim. kunnan, oppilaitoksen tai hyvinvointialueen XR-palvelu, johon kirjaudutaan).
    en: A public sector online service requires electronic identification (e.g. an XR service of a municipality, educational institution or wellbeing services county that requires login).
  obligation:
    fi: Palvelun on hyväksyttävä myös EU:n digitaalisen identiteetin lompakko.
    en: The service must also accept the EU Digital Identity Wallet.
  article: art. 5 f(1)
- condition:
    fi: 'Yksityinen palvelu, joka ei ole mikro- tai pienyritys, käyttää vahvaa tunnistamista lain tai sopimuksen vuoksi, esim. liikenne, energia, pankki- ja rahoituspalvelut, sosiaaliturva, terveydenhuolto, koulutus, televiestintä tai digitaalinen infrastruktuuri.'
    en: 'A private service that is not a micro or small enterprise uses strong user authentication because of law or contract, e.g. transport, energy, banking and finance, social security, health, education, telecommunications or digital infrastructure.'
  obligation:
    fi: Palvelun on hyväksyttävä lompakko käyttäjän vapaaehtoisesta pyynnöstä viimeistään 36 kuukauden kuluttua lompakon täytäntöönpanosäädösten voimaantulosta. Mikro- ja pienyritykset on vapautettu.
    en: The service must accept the wallet at the user's voluntary request no later than 36 months after the wallet implementing acts enter into force. Micro and small enterprises are exempt.
  article: art. 5 f(2)
- condition:
    fi: Palvelu on DSA:n mukainen erittäin suuri verkkoalusta ja vaatii käyttäjien todentamista.
    en: The service is a very large online platform under the DSA and requires user authentication.
  obligation:
    fi: Alustan on hyväksyttävä lompakko käyttäjän vapaaehtoisesta pyynnöstä ja pyydettävä vain palvelun käyttämiseen tarvittavat vähimmäistiedot.
    en: The platform must accept the wallet at the user's voluntary request and request only the minimum data needed to use the service.
  article: art. 5 f(3)
- condition:
    fi: Palvelu tarjoaa sähköisen tunnistamisen menetelmiä tai luottamuspalveluja tai niissä käytettäviä loppukäyttäjätuotteita.
    en: The service provides electronic identification means or trust services, or end-user products used to provide them.
  obligation:
    fi: Palvelut ja tuotteet on tarjottava selkeällä kielellä ja esteettömyysdirektiivin (EU) 2019/882 vaatimusten mukaisesti (ks. eaa).
    en: Services and products must be provided in clear language and in line with the accessibility requirements of Directive (EU) 2019/882 (see eaa).
  article: art. 15
keywords: [EU-lompakko, digitaalinen identiteetti, luottava osapuoli, tunnistaminen, EUDI wallet, relying party, eID]
last_verified: '2026-11-24'
todo: Art. 5 b, 5 f ja 15 tarkistettu EUR-Lexin suomenkielisestä tekstistä (Anna, 24.11.2026). Tarkistamatta lompakon täytäntöönpanosäädösten voimaantulopäivä, josta 36 kuukauden määräaika lasketaan, Suomen rekisteröintiviranomainen luottaville osapuolille ja HE 17/2026:n käsittelyvaihe.
