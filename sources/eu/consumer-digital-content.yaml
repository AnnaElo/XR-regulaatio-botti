id: consumer-digital-content
type: eu-legislation
name:
  fi: Digitaalisen sisällön kuluttajansuoja ja pelien sisäiset ostot
  en: Consumer protection for digital content and in-game purchases
reference:
  fi: Direktiivi (EU) 2019/770; Suomessa kuluttajansuojalaki 38/1978, 5 a luku
  en: Directive (EU) 2019/770; in Finland Consumer Protection Act 38/1978, chapter 5 a
status:
  fi: Sovelletaan 1.1.2022 alkaen tehtyihin sopimuksiin
  en: Applies to contracts concluded from 1 Jan 2022
summary:
  fi: Kuluttajansuoja kattaa myös digitaaliset sisällöt ja palvelut, kuten digitaaliset pelit, myös kun kuluttaja maksaa henkilötiedoillaan. EU:n kuluttajaviranomaisten verkosto (CPC) on julkaissut periaatteet pelien sisäisille virtuaalivaluutoille 21.3.2025.
  en: Consumer protection also covers digital content and services such as digital games, including when the consumer pays with personal data. The EU consumer protection network (CPC) published principles on in-game virtual currencies on 21 March 2025.
jurisdiction: EU
