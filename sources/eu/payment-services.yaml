id: payment-services
type: eu-legislation
name:
  fi: Maksupalvelut ja sähköraha (PSD2, EMD2)
  en: Payment services and electronic money (PSD2, EMD2)
reference:
  fi: Direktiivit (EU) 2015/2366 ja 2009/110/EY; Suomessa maksulaitoslaki 297/2010 ja maksupalvelulaki 290/2010
  en: Directives (EU) 2015/2366 and 2009/110/EC; in Finland the Payment Institutions Act 297/2010 and the Payment Services Act 290/2010
status:
  fi: Voimassa
  en: In force
summary:
  fi: Maksupalvelua saa Suomessa tarjota vain Finanssivalvonnan toimiluvalla tai Finanssivalvonnalle ennen toiminnan aloittamista tehdyn ilmoituksen perusteella. Maksupalvelusta on tyypillisesti kyse, kun maksajan ja maksunsaajan välissä toimiva palveluntarjoaja siirtää varoja osapuolten välillä. Jos alustan oman valuutan voi lunastaa rahaksi tai käyttää muualla kuin alustan omiin sisältöihin, se voi olla sähkörahaa.
  en: In Finland, payment services may only be provided with an FIN-FSA authorisation or on the basis of a notification made to the FIN-FSA before starting. A payment service is typically involved when a provider between payer and payee transfers funds between them. If an in-platform currency can be redeemed for money or used beyond the platform's own content, it may be electronic money.
jurisdiction: EU
