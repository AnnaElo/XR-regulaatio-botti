todo: Lakien numerot ja nimet tarkistettu Finlexistä, mutta pykälä- ja artiklatekstejä ei saatu luettua (EUR-Lex/Finlex palauttivat vain otsikon). Varmista rikoslain 24:5, 24:6, 24:8 ja lain 759/2004 4 luvun sisältö sekä lisää tietosuojavaltuutetun kameravalvonta- ja DPIA-ohjeiden tarkat linkit.
