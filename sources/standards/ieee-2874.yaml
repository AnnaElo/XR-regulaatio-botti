    en: You build a platform where devices, digital twins and XR content of many parties share place-bound information (e.g. smart factory, port or city).
  obligation:
    fi: Toissijainen, maksullinen ja uusi. Voi seurata arkkitehtuurin taustana; toteutuksessa avoimet standardit (GeoPose, DID, VC, OGC API) ovat ensisijaisia.
