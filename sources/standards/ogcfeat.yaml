    fi: XR-sovellus hakee paikkatietokohteita (esim. rakennukset, kohdepisteet, putkistot, nähtävyydet) toisesta järjestelmästä tai avaa omat kohteensa muiden käyttöön.
    en: The XR app fetches geospatial features (e.g. buildings, points of interest, pipelines, sights) from another system or opens its own features for others.
  obligation:
