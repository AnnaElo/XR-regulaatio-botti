id: idta-aas
type: standard
category: domain-data
name:
  fi: Asset Administration Shell (AAS) – teollisuuden digitaalinen kaksonen
  en: Asset Administration Shell (AAS) – industrial digital twin
reference:
  fi: IDTA-01001–01005 (AAS-spesifikaatiot, osat 1–5)
  en: IDTA-01001–01005 (AAS specifications, parts 1–5)
publisher: Industrial Digital Twin Association (IDTA)
availability: free-download
open_alternative: []
version: Release 26-01; osa 1 (Metamodel) v3.2
status:
  fi: 'IDTA:n julkaisu "Release 26-01": osa 1 metamalli (IDTA-01001, v3.2, päivitetty 27.8.2026), osa 2 rajapinnat (IDTA-01002), osa 3a ja 3b tietospesifikaatiot (IEC 61360, mittayksiköt), osa 4 tietoturva (IDTA-01004) ja osa 5 AASX-pakettiformaatti (IDTA-01005).'
  en: 'IDTA "Release 26-01": Part 1 metamodel (IDTA-01001, v3.2, updated 27 Aug 2026), Part 2 APIs (IDTA-01002), Parts 3a and 3b data specifications (IEC 61360, units of measurement), Part 4 security (IDTA-01004) and Part 5 AASX package format (IDTA-01005).'
summary:
  fi: Teollisuuden laitteen tai tuotteen digitaalisen kaksosen vakiomuotoinen kuvaus. Tiedot jaetaan alimalleihin (submodel), joille IDTA julkaisee valmiita pohjia (submodel templates), ja niitä luetaan REST-rajapinnan tai AASX-paketin kautta.
  en: A standardised description of an industrial asset's or product's digital twin. Data is split into submodels, for which IDTA publishes ready-made submodel templates, and is accessed via a REST API or an AASX package.
jurisdiction: global
use_cases: [industry]
content_sources: []
primary_sources:
- title: IDTA, AAS Specifications (Release 26-01)
  url: https://industrialdigitaltwin.org/en/content-hub/aasspecifications
- title: IDTA, Specification of the Asset Administration Shell Part 1 – Metamodel (IDTA-01001)
  url: https://industrialdigitaltwin.org/en/content-hub/aasspecifications/specification-of-the-asset-administration-shell-part-1-metamodel-idta-number-01001
related_regulation:
- id: dataact
  relation:
    fi: Verkkoon liitetyn teollisuuslaitteen tuottaman datan luovuttaminen käyttäjälle on data-asetuksen asia; vakiomuotoinen AAS-rajapinta helpottaa datan luovuttamista.
    en: Sharing data generated by a connected industrial product with its user is a Data Act matter; a standardised AAS API makes sharing easier.
applies_when:
- condition:
    fi: Teollisuuden XR-sovellus (esim. huollon AR-ohje, tehtaan digitaalinen kaksonen) näyttää koneen tai laitteen tietoja, kuten teknisiä tietoja, dokumentaatiota tai reaaliaikaisia mittauksia.
    en: An industrial XR application (e.g. an AR maintenance guide, a factory digital twin) shows data about a machine or device, such as technical data, documentation or real-time measurements.
  obligation:
    fi: 'Hae laitteen tiedot AAS-rajapinnan (osa 2) tai AASX-paketin (osa 5) kautta ja käytä IDTA:n alimallipohjia, kun sopiva on olemassa. Antaa: sama XR-näkymä toimii eri valmistajien laitteille, eikä jokaiselle laitteelle tarvita omaa integraatiota. 3D-geometria siirretään erikseen esim. glTF- tai STEP-muodossa.'
    en: 'Fetch device data via the AAS API (Part 2) or an AASX package (Part 5) and use IDTA submodel templates where a suitable one exists. Gives: the same XR view works for devices from different manufacturers without a separate integration for each. 3D geometry is transferred separately, e.g. as glTF or STEP.'
  article: IDTA-01002, IDTA-01005
keywords:
- digitaalinen kaksonen
- digital twin
- AAS
- Asset Administration Shell
- Industrie 4.0
- teollisuus
- industry
- alimalli
- submodel
- AASX
last_verified: '2026-11-16'
todo: 'Versiot osille 2–5 päätelty IDTA:n sivun kuvatiedostojen nimistä (osa 2 v3.2, 3a v3.1.1, 3b v3.0, osa 4 v3.1, osa 5 v3.2); varmista spesifikaatioista. Sivuilla ei ole lisenssi- tai maksuttomuusmainintaa, vaikka lataus toimii ilman rekisteröitymistä; availability on siksi free-download. Ouluverse-raportti mainitsee alimallipohjat IDTA 02005-1-0 ja 02026-1-0, joiden nimiä ei ole tarkistettu. Tarkista myös IEC 63278 -sarjan asema.'
