todo: Varmista ETSI:n sivulta lopullisen V4.1.1:n julkaisupäivä (toissijaisen lähteen mukaan 2.9.2026) ja EU:n virallisen lehden viittaus (toissijaisen lähteen mukaan odotetaan 22.1.2027). Lisää V3.2.1:n PDF-linkki.
