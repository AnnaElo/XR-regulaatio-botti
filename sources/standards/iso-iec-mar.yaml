  fi: Sekatodellisuuden ja lisätyn todellisuuden käsitteellinen viitemalli sekä todellisten ihmisten ja kohteiden esittäminen MAR-näkymässä.
  en: A conceptual reference model for mixed and augmented reality and the representation of real people and objects in a MAR scene.
