id: sensorthings
type: standard
category: geospatial
name:
  fi: OGC SensorThings API
  en: OGC SensorThings API
publisher: Open Geospatial Consortium
availability: open
version: Part 1 Sensing 1.1
status:
  fi: Part 1 Sensing, versio 1.1, julkaistu 4.8.2021. Versio 2.0 (23-019) listattu OGC:n sivulla.
  en: Part 1 Sensing, version 1.1, published 4 Aug 2021. Version 2.0 (23-019) is listed on the OGC page.
summary:
  fi: IoT-anturien ja mittausten avoin REST-rajapinta. Tuo reaaliaikaisen anturidatan digitaaliseen kaksoseen.
  en: An open REST API for IoT sensors and observations. Brings real-time sensor data into a digital twin.
jurisdiction: global
use_cases: [industry, culture, education]
content_sources: []
primary_sources:
- title: OGC, SensorThings API Part 1 Sensing 1.1
  url: https://docs.ogc.org/is/18-088/18-088.html
- title: OGC, SensorThings API -standardin sivu
  url: https://www.ogc.org/standard/sensorthings/
related_regulation:
- id: dataact
  relation:
    fi: Verkkoon liitettyjen laitteiden tuottaman datan saatavuus käyttäjille on data-asetuksen asia; avoin rajapinta helpottaa datan luovuttamista.
    en: User access to data generated by connected products is a Data Act matter; an open API makes sharing the data easier.
applies_when:
- condition:
    fi: XR-näkymässä näytetään reaaliaikaista anturidataa, esim. tehtaan koneiden tila, rakennuksen olosuhteet tai museon ilmanlaatu digitaalisessa kaksosessa.
    en: An XR view shows real-time sensor data, e.g. machine status in a factory, building conditions or museum air quality in a digital twin.
  obligation:
    fi: 'Hae anturidata SensorThings API:n kautta ja yhdistä se 3D-kohteisiin. Antaa: anturivalmistajasta riippumaton integraatio.'
    en: 'Fetch sensor data through the SensorThings API and link it to 3D objects. Gives: integration independent of the sensor vendor.'
  article: ''
keywords:
- IoT
- anturi
- sensor
- digitaalinen kaksonen
- digital twin
- reaaliaikainen
- real-time
last_verified: '2026-11-14'
todo: Tarkista SensorThings API 2.0:n tila ja päivä.
