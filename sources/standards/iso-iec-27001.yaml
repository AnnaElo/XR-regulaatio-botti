id: iso-iec-27001
type: standard
category: organisation
name:
  fi: ISO/IEC 27001 – Tietoturvallisuuden hallintajärjestelmä
  en: ISO/IEC 27001 – Information security management systems
reference:
  fi: ISO/IEC 27001
  en: ISO/IEC 27001
publisher: ISO/IEC
availability: paid
open_alternative: []
version: ISO/IEC 27001:2022 (tarkistamaton)
status:
  fi: Voimassa oleva painos on ISO/IEC 27001:2022 muutoksineen (tarkistamaton, ks. todo).
  en: The current edition is ISO/IEC 27001:2022 with amendments (unverified, see todo).
summary:
  fi: Organisaation tietoturvallisuuden hallintajärjestelmän vaatimukset (riskienarviointi, hallintakeinot, jatkuva parantaminen). Sertifioitavissa. Koskee organisaatiota, ei yksittäistä XR-tuotetta.
  en: Requirements for an organisation's information security management system (risk assessment, controls, continual improvement). Certifiable. Applies to the organisation, not to a single XR product.
jurisdiction: global
use_cases: []
content_sources: []
primary_sources:
- title: ISO, ISO/IEC 27001 Information security management systems
  url: https://www.iso.org/standard/27001
- title: SFS, standardien myynti Suomessa
  url: https://sales.sfs.fi/
related_regulation:
- id: nis2
  relation:
    fi: NIS2-direktiivi ja Suomen kyberturvallisuuslaki edellyttävät kyberriskien hallintaa. ISO/IEC 27001 on yleinen tapa järjestää ja osoittaa riskienhallinta, mutta laki ei edellytä sertifiointia.
    en: The NIS2 Directive and Finland's Cybersecurity Act require cyber risk management. ISO/IEC 27001 is a common way to organise and demonstrate it, but the law does not require certification.
- id: cra
  relation:
    fi: CRA koskee tuotteen tietoturvaa. ISO/IEC 27001 tukee kehittäjäorganisaation prosesseja (esim. haavoittuvuuksien käsittely), mutta ei yksin osoita tuotteen vaatimustenmukaisuutta.
    en: The CRA covers product security. ISO/IEC 27001 supports the developer organisation's processes (e.g. vulnerability handling) but does not on its own show product conformity.
applies_when:
- condition:
    fi: XR-alustaa tai metaversumipalvelua ylläpidetään tuotannossa, siinä käsitellään käyttäjien henkilötietoja tai asiakas (esim. julkinen hankkija) edellyttää näyttöä tietoturvan hallinnasta.
    en: An XR platform or metaverse service is run in production, processes users' personal data, or a customer (e.g. a public buyer) requires evidence of security management.
  obligation:
    fi: 'Rakenna tietoturvan hallinta ISO/IEC 27001:n mukaisesti: riskienarviointi, liitteen A hallintakeinot ja säännöllinen sisäinen auditointi. Antaa: yhteinen kieli asiakkaiden ja auditoijien kanssa sekä pohja NIS2-velvoitteille. Mainitse standardi toissijaisena, koska se on maksullinen.'
    en: 'Build security management according to ISO/IEC 27001: risk assessment, Annex A controls and regular internal audits. Gives: a shared language with customers and auditors and a basis for NIS2 obligations. Mention it as secondary because it is paid.'
  article: ''
- condition:
    fi: Kyse on tutkimus- tai pilottihankkeen prototyypistä (TRL 1–6).
    en: The work is a prototype in a research or pilot project (TRL 1–6).
  obligation:
    fi: Sertifiointi ei yleensä ole tarpeen. Ota silti käyttöön kevyet käytännöt, kuten pääsynhallinta, varmuuskopiot ja riippuvuuksien päivitys.
    en: Certification is usually not needed. Still adopt light practices such as access control, backups and dependency updates.
  article: ''
keywords:
- tietoturva
- information security
- ISMS
- ISO 27001
- sertifiointi
- certification
- riskienhallinta
last_verified: ''
todo: 'Painos ja muutokset ovat muistinvaraisia (ISO/IEC 27001:2022 ja muutos Amd 1:2024): iso.org palautti virheen 16.11.2026. Tarkista ISO:n tai SFS:n sivulta. Lisätty Ouluverse-raportin (v0.9) perusteella, jossa standardi mainitaan TRL 7–9 -vaiheessa.'
