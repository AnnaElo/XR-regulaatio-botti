# Pohja yhdelle säädökselle, standardille tai käyttötapaushuomiolle. Kopioi nimellä <id>.yaml oikeaan kansioon.
# Kaikki käyttäjälle näkyvät tekstit kirjoitetaan sekä suomeksi (fi) että englanniksi (en).
id: ""                     # lyhyt tunniste, sama kuin tiedostonimi
type: ""                   # standard | eu-legislation | eu-policy | national-legislation | standard-in-development | use-case-guidance
category: ""               # standardeille: xr-runtime | 3d-content | reality-capture | geospatial | identity | accessibility
                           #   | provenance | domain-data | safety-ergonomics | organisation
name: {fi: "", en: ""}
reference: {fi: "", en: ""}  # säädöksen numero tai standardin tunnus, esim. "Asetus (EU) 2016/679"
publisher: ""              # standardeille: Khronos Group, W3C, OGC, ISO/IEC, IEEE ...
availability: ""           # VAIN standardeille:
                           #   open          = spesifikaatio luettavissa verkossa maksutta ilman rekisteröitymistä (ensisijainen suositus)
                           #   free-download = maksuton, mutta vaatii esim. rekisteröitymisen tai latauksen julkaisijalta (ensisijainen)
                           #   paid          = maksullinen ISO/IEC-, MPEG-I-, IEEE- tai muu standardi (toissijainen, mainitaan avointen jälkeen)
open_alternative: []       # paid-standardeille: avoimet standardit (id), jotka kattavat saman tarpeen
version: ""                # standardin versio tai painos, esim. "1.1.53" tai "ISO/IEC 23090-14:2023"
status: {fi: "", en: ""}   # voimassaolo, versio tai soveltamispäivät
summary: {fi: "", en: ""}  # 1–2 virkettä
jurisdiction: ""           # global | EU | FI | US | ...  (botti suodattaa käyttäjän markkina-alueen mukaan)
use_cases: []              # education | culture | industry | healthcare  (tyhjä = kaikki)
content_sources: []        # ai-generated | drone | laser-scanning | phone-camera | 3d-artist  (tyhjä = kaikki)
primary_sources:           # AINA ensisijainen lähde: EUR-Lex, Finlex, standardin julkaisijan oma sivu (itse spesifikaatio, ei tiedote)
  - {title: "", url: ""}
finland:                   # vain säädöksille: Suomen viranomainen ja kansalliset tulkintaohjeet
  authority: {fi: "", en: ""}
  national_guidance:
    - {title: "", url: ""}
related_regulation:        # standardeille: säädökset, jotka viittaavat standardiin tai joiden täyttämistä se tukee
  - id: ""                 # sources/eu/<id>.yaml tai muu tietopohjan id
    relation: {fi: "", en: ""}
related_standards: []      # säädöksille: standardit (id), joihin säädös viittaa tai jotka tukevat sen täyttämistä
related_documents: []      # käyttötapaushuomioille: tietopohjan säädökset ja standardit (id), joihin huomio ohjaa
applies_when:              # botti perustelee suosituksensa näillä
  - condition: {fi: "", en: ""}   # milloin koskee XR-toteutusta
    obligation: {fi: "", en: ""}  # säädöksille: mitä kehittäjän pitää tehdä. Standardeille: mitä standardi antaa / miten sitä käytetään
    article: ""                   # artikla, pykälä tai standardin luku
keywords: []
last_verified: ""          # VVVV-KK-PP, milloin tiedot on viimeksi tarkistettu ensisijaisesta lähteestä
todo: ""
