id: arpajaislaki
type: national-legislation
name:
  fi: Arpajaislaki
  en: Lotteries Act (Finland)
reference:
  fi: Laki 1047/2001; muutoslaki 11/2026 (HE 16/2025, voimaan 1.7.2027); rahapeleistä rahapelilaki 10/2026
  en: Act 1047/2001; amending Act 11/2026 (HE 16/2025, in force 1 Jul 2027); gambling in the Gambling Act 10/2026
status:
  fi: Voimassa; muutettu 2 §:n määritelmä ja rahapelien siirto rahapelilakiin voimaan 1.7.2027
  en: In force; the amended section 2 definition and the move of gambling to the Gambling Act apply from 1 Jul 2027
summary:
  fi: 'Arpajaisia ovat toiminta, johon osallistutaan vastiketta vastaan ja jossa voi saada kokonaan tai osittain sattumaan perustuvan rahanarvoisen voiton. 30.6.2027 asti määritelmä kattaa myös rahavoitot, kasinopelit ja raha-automaatit; 1.7.2027 alkaen rahavoitot on rajattu pois ja niistä säädetään rahapelilaissa. 1.7.2027 alkaen arpajaisia saa toimeenpanna vain yleishyödyllinen yhteisö, jonka kotipaikka on Suomessa, ja muu toimeenpano on kielletty.'
  en: 'A lottery is an activity with paid participation where a participant can win a prize of monetary value based wholly or partly on chance. Until 30 Jun 2027 the definition also covers cash prizes, casino games and slot machines; from 1 Jul 2027 cash prizes are excluded and governed by the Gambling Act. From 1 Jul 2027, lotteries may only be run by a non-profit organisation domiciled in Finland; other forms are prohibited.'
jurisdiction: FI
use_cases: []
content_sources: []
primary_sources:
- title: Finlex, arpajaislaki 1047/2001
  url: https://www.finlex.fi/fi/lainsaadanto/2001/1047
finland:
  authority:
    fi: Poliisihallitus (valtakunnallinen valvonta) ja poliisilaitokset; rahapeleissä Lupa- ja valvontavirasto
    en: National Police Board (national supervision) and police departments; for gambling, the Licensing and Supervisory Agency
  national_guidance: []
related_documents: [consumer-digital-content, virtual-world-economy]
applies_when:
- condition:
    fi: Palvelussa myydään maksullisia laatikoita, arvontoja tai muita satunnaispalkintoja (loot box), ja palkinnoilla voi olla rahanarvoa, esim. koska ne voi myydä tai vaihtaa.
    en: The service sells paid boxes, draws or other random rewards (loot boxes), and the rewards may have monetary value, e.g. because they can be sold or traded.
  obligation:
    fi: 'Järjestely voi täyttää arpajaisten määritelmän: vastike, sattuma ja rahanarvoinen voitto. Yritys ei voi toimeenpanna arpajaisia, koska oikeus on vain yleishyödyllisillä yhteisöillä, ja muu toimeenpano on kielletty (62 §). Jos voiton saa rahana, kyse voi olla rahapelistä (rahapelilaki 10/2026). Botti ei voi ratkaista, onko virtuaaliesine rahanarvoinen voitto: pyydä oikeudellinen arvio ennen toteutusta.'
    en: 'The arrangement may meet the lottery definition: consideration, chance and a prize of monetary value. A company cannot run lotteries, as only non-profit organisations may, and other forms are prohibited (s. 62). If the prize can be obtained as money, it may be gambling (Gambling Act 10/2026). The bot cannot decide whether a virtual item is a prize of monetary value: get a legal assessment before implementing.'
  article: Arpajaislaki 2 § (sekä nykyinen että 1.7.2027 voimaan tuleva sanamuoto); 5 § ja 62 § 1.7.2027 alkaen
- condition:
    fi: Asiakkaalle annetaan sattumanvarainen etu markkinoinnissa, ja edun saaminen edellyttää vain tuotteen ostamista.
    en: A random benefit is given in marketing, and getting it requires only buying a product.
  obligation:
    fi: Arpajaislaki ei koske tällaista markkinointietua (1 § 3 mom.). Kuluttajansuojan markkinointisäännöt koskevat silti.
    en: The Lotteries Act does not cover such a marketing benefit (s. 1(3)). Consumer marketing rules still apply.
  article: Arpajaislaki 1 § 3 mom.
keywords: [arpajaiset, loot box, ryöstölaatikko, satunnaispalkinto, rahapeli, lottery, gambling]
last_verified: '2026-11-15'
todo: Muutoslaki 11/2026 ja 2 §:n nykyinen sanamuoto tarkistettu Finlexistä (Anna, 15.11.2026). 30.6.2027 asti voimassa olevia 5 §:ää (toimeenpano-oikeus) ja rahapelien yksinoikeutta ei ole tarkistettu. Rahapelilakia 10/2026 ei ole tietopohjassa. Viranomaisen kannanottoa loot boxeihin ei löytynyt.
